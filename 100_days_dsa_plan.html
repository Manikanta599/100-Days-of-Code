  "Arrays": ["#E6F1FB","#042C53"],
  "Strings": ["#E1F5EE","#04342C"],
  "Hashing": ["#FAEEDA","#412402"],
  "Linked List": ["#FBEAF0","#4B1528"],
  "Stack & Queue": ["#EEEDFE","#26215C"],
  "Trees": ["#EAF3DE","#173404"],
  "Graphs": ["#FAECE7","#4A1B0C"],
  "DP": ["#FAC775","#412402"],
  "Heap": ["#B5D4F4","#042C53"],
  "Backtracking": ["#F4C0D1","#4B1528"],
  "Greedy": ["#C0DD97","#173404"],
  "Bit Manipulation": ["#D3D1C7","#2C2C2A"],
  "Math": ["#F0997B","#4A1B0C"],
  "Recursion": ["#AFA9EC","#26215C"],
  "Design": ["#9FE1CB","#04342C"],
  "Advanced DS": ["#FAC775","#633806"],
  "Mixed": ["#F1EFE8","#2C2C2A"]
};

function tagStyle(tag) {
  const c = TAG_COLORS[tag] || ["#F1EFE8","#2C2C2A"];
  return `background:${c[0]};color:${c[1]};`;
}

function diffClass(d) {
  if(d==="Easy") return "diff-easy";
  if(d==="Medium") return "diff-medium";
  return "diff-hard";
}

let currentFilter = "all";
let allExpanded = false;

function render(days) {
  const container = document.getElementById("plan-container");
  if(days.length === 0) {
    container.innerHTML = '<div class="no-results">No results found. Try a different search or filter.</div>';
    return;
  }

  let html = "";
  let weekDays = [];
  let weekNum = 1;

  const flush = () => {
    if(weekDays.length === 0) return;
    html += `<div class="week-group"><div class="week-label">Week ${weekNum} — Days ${weekDays[0].day}–${weekDays[weekDays.length-1].day}</div>`;
    weekDays.forEach(d => {
      html += `<div class="day-card" data-day="${d.day}">
        <div class="day-header" onclick="toggleDay(${d.day})">
          <span class="day-num">Day ${d.day}</span>
          <span class="day-topic">${d.topic}</span>
          <span class="day-tag topic-pill" style="${tagStyle(d.tag)}">${d.tag}</span>
          <i class="ti ti-chevron-down chevron" id="chev-${d.day}" aria-hidden="true"></i>
        </div>
        <div class="day-body" id="body-${d.day}">
          <ul class="q-list">
            ${d.qs.map((q,i) => `<li class="q-item">
              <span class="q-num">${i+1}.</span>
              <span class="q-text">${q[0]}</span>
              <span class="q-diff ${diffClass(q[1])}">${q[1]}</span>
            </li>`).join("")}
          </ul>
        </div>
      </div>`;
    });
    html += `</div>`;
    weekDays = [];
    weekNum++;
  };

  days.forEach((d, i) => {
    const relWeek = Math.floor(i / 7);
    if(weekDays.length > 0 && relWeek !== Math.floor((i-1)/7)) flush();
    weekDays.push(d);
  });
  flush();

  container.innerHTML = html;
  document.getElementById("result-count").textContent = `Showing ${days.length} of 100 days`;
}

window.toggleDay = function(day) {
  const body = document.getElementById("body-" + day);
  const chev = document.getElementById("chev-" + day);
  if(body.classList.contains("open")) {
    body.classList.remove("open");
    chev.style.transform = "";
  } else {
    body.classList.add("open");
    chev.style.transform = "rotate(180deg)";
  }
};

function getFilteredDays() {
  let days = DAYS;
  const q = document.getElementById("searchBox").value.toLowerCase().trim();
  if(currentFilter !== "all") days = days.filter(d => d.tag === currentFilter);
  if(q) days = days.filter(d =>
    d.topic.toLowerCase().includes(q) ||
    d.tag.toLowerCase().includes(q) ||
    String(d.day).includes(q) ||
    d.qs.some(qr => qr[0].toLowerCase().includes(q))
  );
  return days;
}

document.querySelectorAll(".filter-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentFilter = btn.dataset.filter;
    render(getFilteredDays());
  });
});

document.getElementById("searchBox").addEventListener("input", () => render(getFilteredDays()));

document.getElementById("expandAllBtn").addEventListener("click", () => {
  allExpanded = !allExpanded;
  document.querySelectorAll(".day-body").forEach(b => {
    if(allExpanded) b.classList.add("open");
    else b.classList.remove("open");
  });
  document.querySelectorAll(".chevron").forEach(c => {
    c.style.transform = allExpanded ? "rotate(180deg)" : "";
  });
  document.getElementById("expandAllBtn").textContent = allExpanded ? "Collapse all" : "Expand all";
});

const easyC = DAYS.reduce((a,d) => a + d.qs.filter(q=>q[1]==="Easy").length, 0);
const medC = DAYS.reduce((a,d) => a + d.qs.filter(q=>q[1]==="Medium").length, 0);
const hardC = DAYS.reduce((a,d) => a + d.qs.filter(q=>q[1]==="Hard").length, 0);
document.getElementById("easy-count").textContent = `${easyC}/${medC}/${hardC}`;

render(DAYS);
</script>
